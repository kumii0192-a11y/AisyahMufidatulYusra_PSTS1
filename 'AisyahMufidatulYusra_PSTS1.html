<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PSTS 1</title>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    </head>
    <body class="items-center">
        <header class="bg-red-800 w-full p-4">
            <h1 class="text-white text-center font-bold text-2xl">Student Creativity Festival</h1>
            <p class="text-white text-center">Showcase Your Creativity, Skills and Innovative Ideas</p>
        </header>

        <div class="mx-60 pb-4 pt-2 bg-yellow-50 flex content-center justify-center shadow-sm rounded-3xl">    
            <form>
                <table class="w-50">
                <thead class="pt-2">
                    <tr>
                        <th colspan="2" class="text-xl"><label>Registration Form</label></th>
                    </tr>
                </thead><br>
                <tbody>
                <tr>
                    <td><label class="w-50 text-left">Student Name</label><br></td>
                    <td><input type="text" name="name" placeholder="Enter your full name" maxlength="50" required><br></td>
                </tr>

                <tr><td><label class="w-50 text-left">Class</label><br></td>
                <td><select name="class" placeholder="----------" required>
                    <option>X</option>
                    <option>XI</option>
                    <option>XII</option>
                </select><br></td>
                </tr>

                <tr><td rowspan="2"><label class="w-50 text-left">Gender</label><br></td>
                <td><input type="radio" name="gender" value="Male" required>Male</td>
                <td><input type="radio" name="gender" value="Female">Female<br></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                </tr>
                <tr><td><label class="w-50 text-left">Competition Category</label><br></td>
                <td><select name="competition" placeholder="----------" required>
                    <option>Web Development</option>
                    <option>IoT Project</option>
                    <option>Graphic Design</option>
                    <option>Public Speaking</option>
                    <option>Photography</option>
                </select><br></td>
                </tr>

                <tr><td rowspan="2"><label class="w-50 text-left">Participant Type</label><br></td><br>
                <td><input type="radio" name="participant" value="Individual" required>Individual</td>
                <td><input type="radio" name="participant" value="Team">Team<br></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                </tr>
                <tr><td><label class="w-50 text-left">Team Name</label><br></td>
                <td><input type="text" name="teamname" placeholder="Enter your team's name" maxlength="50"><br></td>
                </tr>

                <tr><td><label class="w-50 text-left">Contact Number</label><br></td>
                <td><input type="tel" placeholder="08xxxxxxxx" required><br></td>

                <tr><td><label class="text-left w-50">Project Description</label><br></td>
                <td><textarea rows="5" cols="40" placeholder="Describe your project or competition entry..." required></textarea><br></td>
                </tr>
                </tbody>
                <tfoot>
                <tr><td></td>
                    <td><button type="submit" value="Submit" class="rounded-full font-bold text-white bg-red-400 w-40 h-10 hover:bg-red-600 focus:outline-2 focus:outline-offset-2 focus:outline-red-500">Register Now</button></td>
                </tr>
                </tfoot>
                </table>
            </form>
        </div><br>

        <div class="p-5 flex content-center justify-center w-full rounded-full">
            <table class="p-5 border-yellow-300 border-x-10 rounded-5xl w-full p-6">
                <thead class="p-5 bg-red-800 h-8">
                    <tr>
                        <th class="text-white">No</th>
                        <th class="text-white">Participant</th>
                        <th class="text-white">Class</th>
                        <th class="text-white">Category</th>
                        <th class="text-white">Team</th>
                        <th class="text-white">Status</th>
                    </th>
                </thead>
                <tbody class="p-5 border-yellow-300 h-8">
                    <tr>
                        <td class="w-20 text-center">1</td>
                        <td class="w-40">Ahmad Fauzan</td>
                        <td class="w-20 text-center">X</td>
                        <td class="w-40 text-center">Web Development</td>
                        <td class="w-40 text-center">CodeX</td>
                        <td class="w-40 text-center">Registered</td>
                    </tr>

                    <tr>
                        <td class="text-center">2</td>
                        <td>Aisyah Putri</td>
                        <td class="text-center">XI</td>
                        <td class="text-center">IoT Project</td>
                        <td class="text-center">SmartTech</td>
                        <td class="text-center">Pending</td>
                    </tr>
                </tbody>
            </table>
        </div><br><br>
        <footer class="bg-red-800 w-full p-4">
            <p class="font-bold text-white text-center">&copy;2026 - 'Aisyah X-8</p>
        </footer>
    </body>
</html>
